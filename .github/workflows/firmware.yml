# Build the firmware for every supported board, and on a version tag publish it
# twice: as a release for people, and on GitHub Pages for the console's update
# check.
#
# The two destinations exist for one reason: a browser cannot fetch a release
# asset. GitHub serves those without an Access-Control-Allow-Origin header, so
# a page on the device's own origin is refused by CORS, while Pages serves
# everything with `*`. The console therefore reads a small manifest from Pages
# and hands the image to the device itself - the device never talks to the
# internet, which is the point.
#
# Boards are built separately (see boards/README.md): ESP32-P4 rev <3.0 and
# >=3.0 are mutually exclusive build targets, so there is no single universal
# image. Each board gets its own release assets and its own Pages manifests
# under firmware/<board>/ and flash/<board>/. The root firmware/ and flash/
# manifests mirror the default board (p4-eth, the Waveshare ESP32-P4-ETH), which
# is also what every P4-ETH device polls, so those and flasher pages that predate
# the per-board layout keep working.
name: firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two pieces of the capture path are plain C over a pixel buffer - reading a
  # screen as characters, and deciding a screen has gone to one flat colour - so
  # their tests run here in a second rather than needing a board and a target
  # sitting in its BIOS. Both are the kind of thing that breaks quietly.
  screentext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: components/kvm_screentext/test/run.sh
      - run: components/video_pipeline/test/run.sh
      # Two settings on one pin. This one guards what arrives from outside -
      # a board overlay naming a GPIO something else already holds.
      - run: components/kvm_config/test/run.sh
      # The runbook parser: every verb and every refusal, on a host.
      - run: components/kvm_runbook/test/run.sh
      # The cron parser and matcher.
      - run: components/kvm_sched/test/run.sh

  # The console's own logic: the fake machine the demo runs on, the settings
  # file, the keyboard tables, the text layer. Node runs the TypeScript as it
  # is, so this needs nothing but a checkout and an npm ci - and it is where a
  # regression like "fast typing repeats a letter" gets caught before anyone
  # else finds it.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web

  # The paste tables: self-consistent (no two characters on one key), and right
  # (every character where the real layout puts it). Both are the kind of
  # mistake that types the wrong character into somebody's BIOS and reports
  # nothing, so they are checked on every push rather than by eye.
  layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: node tools/check_layouts.mjs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xkb-data
        # --require-xkb: without it the script skips itself where the database is
        # missing, which is right on a developer's machine and useless here - a
        # check that silently passes is worse than no check.
      - run: python3 tools/check_layouts_xkb.py --require-xkb

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          # Default build - Waveshare ESP32-P4-ETH (chip rev v1.3, 32 MB).
          - id: p4-eth
            build_dir: build
            sdkconfig_defaults: sdkconfig.defaults
          # Espressif ESP32-P4 Function EV Board (chip rev v3.2, 16 MB) - an
          # overlay on top of the common defaults; see boards/funcev_p4.defaults.
          - id: funcev
            build_dir: build.funcev
            sdkconfig_defaults: sdkconfig.defaults;boards/funcev_p4.defaults
          # Configured from datasheets, NOT yet verified on hardware (a few pins
          # still need confirming - see the overlays). Built and published so people
          # with the board can try them; in theory they should work.
          - id: p4-nano
            build_dir: build.nano
            sdkconfig_defaults: sdkconfig.defaults;boards/nano_p4.defaults
          - id: p4-guition
            build_dir: build.guition
            sdkconfig_defaults: sdkconfig.defaults;boards/guition_p4.defaults
          # Waveshare ESP32-P4-WIFI6-POE-ETH - the first board here that takes
          # PoE. Configured from its published schematic; not yet run on one.
          - id: p4-poe
            build_dir: build.poe
            sdkconfig_defaults: sdkconfig.defaults;boards/poe_p4.defaults
          # M5Stack Unit PoE-P4 and its rev 3.x twin, the PoE-P4X. Capture is
          # M5Stack's own Display In add-on (an LT6911D), not a C790, so these
          # images are only half a port until that driver lands. Built and
          # published so an owner can get the network half working.
          - id: m5-poe-p4
            build_dir: build.m5poe
            sdkconfig_defaults: sdkconfig.defaults;boards/m5_poe_p4.defaults
          - id: m5-poe-p4x
            build_dir: build.m5poex
            sdkconfig_defaults: sdkconfig.defaults;boards/m5_poe_p4.defaults;boards/m5_poe_p4x.defaults
          # JetKVM Mini and Mini W - JetKVM's finished box on an ESP32-P4X, so
          # rev 3.x only. Pins from JetKVM's open firmware; not run on one yet.
          - id: jetkvm-mini
            build_dir: build.jetkvm_mini
            sdkconfig_defaults: sdkconfig.defaults;boards/jetkvm_mini.defaults
          - id: jetkvm-mini-w
            build_dir: build.jetkvm_mini_w
            sdkconfig_defaults: sdkconfig.defaults;boards/jetkvm_mini.defaults;boards/jetkvm_mini_w.defaults
          # Waveshare ESP32-P4-WIFI6-DEV-KIT - both links on one board, Ethernet
          # and a C6, on pins we already use.
          - id: p4-wifi6-devkit
            build_dir: build.wifi6devkit
            sdkconfig_defaults: sdkconfig.defaults;boards/wifi6devkit_p4.defaults
          # Waveshare ESP32-P4-Module-DEV-KIT - the WIFI6-DEV-KIT's arrangement
          # on a module: P4, C6 and 16 MB of flash under one shield, Ethernet
          # with a PoE header, and the OTG-HS switched to a Type-A socket by a
          # jumper. Read off its schematic; nobody has run it on one yet.
          - id: p4-module-devkit
            build_dir: build.moduledevkit
            sdkconfig_defaults: sdkconfig.defaults;boards/moduledevkit_p4.defaults
          # DFRobot FireBeetle 2 ESP32-P4 - the smallest board that can do the
          # whole job, and WiFi-only like the WIFI6. Read off its schematic and
          # Espressif's Arduino variant for it; not run on one yet.
          - id: firebeetle2-p4
            build_dir: build.firebeetle
            sdkconfig_defaults: sdkconfig.defaults;boards/firebeetle2_p4.defaults
          # Waveshare ESP32-P4-NANO-WIFI6-DB - the NANO with a dual-band
          # ESP32-C5 in place of the C6, and rev 3.x silicon, so this one is a
          # rev3 image with no pre-3.0 twin. Read off the vendor's pin table.
          - id: p4-nano-wifi6-db
            build_dir: build.nanodb
            sdkconfig_defaults: sdkconfig.defaults;boards/nano_wifi6_db_p4.defaults
          # Espressif ESP32-P4X-C5-Function-EV-Board - the Function EV with a
          # dual-band ESP32-C5 in place of the C6, rev 3.x only. From
          # Espressif's user guide and esp-hosted's preset for it.
          - id: funcev-c5
            build_dir: build.funcev_c5
            sdkconfig_defaults: sdkconfig.defaults;boards/funcev_p4.defaults;boards/funcev_c5_p4.defaults
          # Waveshare ESP32-P4-WIFI6-DB - the WIFI6 with an ESP32-C5 and an
          # NRW32X (rev 3.x only). From Waveshare's documentation page.
          - id: p4-wifi6-db
            build_dir: build.waveshare_wifi6_db
            sdkconfig_defaults: sdkconfig.defaults;boards/waveshare_p4_wifi6.defaults;boards/waveshare_p4_wifi6_db.defaults
          # VIEWE ESP32-P4-Pi - a Pi-shaped carrier for VIEWE's own P4+C6
          # module: Ethernet, a 15-pin camera FPC, and the OTG-HS on its own
          # Type-C. Read off both of their schematics; not run on one yet.
          - id: viewe-p4-pi
            build_dir: build.viewe
            sdkconfig_defaults: sdkconfig.defaults;boards/viewe_p4_pi.defaults
          # Waveshare ESP32-P4-WIFI6 - no Ethernet; ESP32-C6 SDIO WiFi and a
          # setup hotspot are the only management link.
          - id: p4-wifi6
            build_dir: build.waveshare_wifi6
            sdkconfig_defaults: sdkconfig.defaults;boards/waveshare_p4_wifi6.defaults
          # The same two Waveshare boards on rev 3.x silicon. Espressif is still
          # ramping that revision up (volume expected around October 2026) and a
          # product code does not tell you which one is in the box, so both have
          # to be published side by side. Neither image starts on the other's
          # chip - the header carries a minimum and a maximum revision.
          - id: p4-eth-rev3
            build_dir: build.eth_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/p4eth_rev3.defaults
          - id: p4-poe-rev3
            build_dir: build.poe_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/poe_p4.defaults;boards/poe_p4_rev3.defaults
          # The NANO and the Guition arrive as either revision under one product
          # code - a NANO tested here in August was pre-3.0 and one bought a
          # fortnight later was v3.1 (#24) - so they need both images too.
          - id: p4-nano-rev3
            build_dir: build.nano_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/nano_p4.defaults;boards/nano_p4_rev3.defaults
          - id: p4-guition-rev3
            build_dir: build.guition_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/guition_p4.defaults;boards/guition_p4_rev3.defaults
          - id: p4-wifi6-devkit-rev3
            build_dir: build.wifi6devkit_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/wifi6devkit_p4.defaults;boards/wifi6devkit_p4_rev3.defaults
          - id: p4-wifi6-rev3
            build_dir: build.waveshare_wifi6_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/waveshare_p4_wifi6.defaults;boards/waveshare_p4_wifi6_rev3.defaults
          # The other way round: funcev is the rev 3.x image (and keeps its id,
          # so running devices keep updating), and this is its pre-3.0 twin for
          # the earlier Function EV units.
          - id: funcev-rev1
            build_dir: build.funcev_rev1
            sdkconfig_defaults: sdkconfig.defaults;boards/funcev_p4.defaults;boards/funcev_p4_rev1.defaults
          # Waveshare's shop now lists the ESP32-P4-Module as NRW32X (rev 3.x).
          - id: p4-module-devkit-rev3
            build_dir: build.moduledevkit_rev3
            sdkconfig_defaults: sdkconfig.defaults;boards/moduledevkit_p4.defaults;boards/moduledevkit_p4_rev3.defaults
    steps:
      - uses: actions/checkout@v7
        with:
          # The version string comes from `git describe`, which needs history.
          fetch-depth: 0
          # The web console lives in the espkvm/console submodule at web/.
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console is embedded in the firmware as a gzip blob (identical for
      # every board). Building it here rather than trusting the committed copy
      # means the image always carries the interface that matches its sources.
      - name: Build the console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Report whether the committed console was stale
        run: git diff --stat -- components/kvm_web/assets || true

      # A tag is the version. Without this the firmware would report the commit
      # it was built from, which tells an operator nothing about what to expect.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${GITHUB_REF_NAME}" > version.txt

      - name: Build ${{ matrix.board.id }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32p4
          # Both steps belong in the container: git inside it refuses a
          # repository owned by another user (and ESP-IDF then has no version to
          # stamp into the image), and merge-bin needs the esptool that ships
          # with this IDF, which does not exist on the runner.
          command: >-
            git config --global --add safe.directory "$PWD" &&
            idf.py -B ${{ matrix.board.build_dir }}
            -D SDKCONFIG=${{ matrix.board.build_dir }}/sdkconfig
            -D SDKCONFIG_DEFAULTS="${{ matrix.board.sdkconfig_defaults }}"
            build &&
            idf.py -B ${{ matrix.board.build_dir }}
            merge-bin -o espkvm-merged.bin &&
            riscv32-esp-elf-nm -nC ${{ matrix.board.build_dir }}/espkvm.elf
            > ${{ matrix.board.build_dir }}/espkvm.sym &&
            riscv32-esp-elf-objcopy --strip-debug
            ${{ matrix.board.build_dir }}/espkvm.elf
            ${{ matrix.board.build_dir }}/espkvm-stripped.elf

      - name: Collect what a person or a device might want
        run: |
          version="${GITHUB_REF_NAME}"
          board="${{ matrix.board.id }}"
          bdir="${{ matrix.board.build_dir }}"
          case "$GITHUB_REF" in
            refs/tags/*) base="espkvm-${version}-${board}" ;;
            *)           base="espkvm-$(git describe --always --dirty)-${board}" ;;
          esac
          mkdir -p out
          cp "${bdir}/espkvm.bin" "out/${base}.bin"
          # Everything needed to flash a board that has never run this firmware.
          mkdir -p full
          cp "${bdir}/espkvm.bin" "${bdir}/bootloader/bootloader.bin" \
             "${bdir}/partition_table/partition-table.bin" "${bdir}/ota_data_initial.bin" \
             "${bdir}/flasher_args.json" full/
          (cd full && zip -q "../out/${base}-full-flash.zip" ./*)
          # One image for the browser flasher: it writes a single blob at 0x0
          # rather than juggling offsets, and this also covers a board that has
          # never had a bootloader. Built in the container, above.
          cp "${bdir}/espkvm-merged.bin" "out/${base}-merged.bin"
          # Per-board so the two matrix jobs' sums do not clobber on merge.
          (cd out && sha256sum ./*"${board}"* > "sha256sums-${board}.txt")
          # Which function is at which address. A panic prints an address and
          # nothing else, and the build that could name it is thrown away, so
          # reading a crash meant rebuilding that exact release first (see #22).
          # After the sums on purpose: this is not something anyone flashes, and
          # the release job packs every board's into one archive.
          cp "${bdir}/espkvm.sym" "out/${base}.sym"
          # And the ELF a crash dump is read against. Stripped of debug info it
          # is 3 MB instead of 18 and still carries every symbol, so a backtrace
          # comes out with function names - only the line numbers are missing,
          # and those need the full ELF kept as a build artefact below.
          cp "${bdir}/espkvm-stripped.elf" "out/${base}.elf"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board.id }}
          path: out/
          if-no-files-found: error

      # The unstripped ELF, which is the only thing that turns a crash dump
      # into file and line. Too big for a release asset at 18 MB a board, and
      # rarely wanted after a version has been superseded - so it lives here,
      # for as long as an artefact lives. Tags only: every branch push would
      # otherwise leave a quarter of a gigabyte behind.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: elf-${{ matrix.board.id }}
          path: ${{ matrix.board.build_dir }}/espkvm.elf
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: out
          merge-multiple: true

      - name: Fewer files on the release page
        # The per-board pieces exist because the matrix builds in parallel, not
        # because anyone wants them separately: one archive of symbol maps and
        # one list of checksums are easier to find among the images. This is the
        # release page only - the Pages job reads the artefacts, where the
        # per-board files are untouched.
        run: |
          cd out
          zip -q -j "espkvm-${GITHUB_REF_NAME}-symbols.zip" ./*.sym
          rm ./*.sym
          zip -q -j "espkvm-${GITHUB_REF_NAME}-elf.zip" ./*.elf
          rm ./*.elf
          cat sha256sums-*.txt | sed 's| \./| |' | sort -k2 > sha256sums.txt
          rm sha256sums-*.txt
          ls -l

      - name: Source with its submodules
        # GitHub's own source archives leave out the console and microlink, so
        # they do not build (#63). This one carries every tracked file of all
        # three, symlinks kept as symlinks.
        run: |
          name="espkvm-${GITHUB_REF_NAME}-source"
          git ls-files --recurse-submodules -z |
            tar --null -T - --transform "s,^,${name}/,S" -czf "out/${name}.tar.gz"
          tar -tzf "out/${name}.tar.gz" | wc -l

      - name: Build release notes from the changelog
        run: |
          # The tag is v.<version>; pull that version's section out of the
          # changelog (everything under "## [<version>]" up to the next heading)
          # to use as the release body. Leading/trailing blank lines are trimmed.
          # If there is no matching section, the file is left empty and the
          # publish step falls back to auto-generated notes.
          version="${GITHUB_REF_NAME#v.}"
          awk -v ver="$version" '
            BEGIN { gsub(/\./, "\\.", ver); re = "^## \\[" ver "\\]" }
            $0 ~ re { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the changelog section as the body; fall back to auto-generated
          # notes only when the changelog has no section for this version.
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          # Idempotent, so re-running a tag's workflow does not fail on a
          # release that already exists: create it if it is new, otherwise
          # replace its files in place and refresh the notes.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
            if [ -s release-notes.md ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "$GITHUB_REF_NAME" \
              "${notes[@]}"
          fi

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Publishing the update manifest is the convenience; the release above is
    # the release. If Pages is not enabled on the repository this job fails on
    # its own rather than marking the tag as broken.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7   # for boards/boards.json
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: out
          merge-multiple: true

      # What the console (firmware/) and the browser flasher (flash/) read, one
      # set per board. The console's update check reads the plain .bin; the
      # flasher reads esp-web-tools' schema pointing at the merged image - a
      # different consumer, hence a separate file.
      - name: Assemble the per-board manifests
        run: |
          version="${GITHUB_REF_NAME}"
          released="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p site
          # The boards are whatever the build jobs actually produced - one
          # sha256sums-<board>.txt each. A hand-kept list here went stale twice
          # and silently published nothing for the boards it had missed.
          boards="$(cd out && ls sha256sums-*.txt | sed -E 's/^sha256sums-(.*)\.txt$/\1/' | sort)"
          [ -n "${boards}" ] || { echo "no board artefacts to publish"; exit 1; }
          echo "publishing: ${boards}"
          for board in ${boards}; do
            bin="$(cd out && ls espkvm-*-"${board}".bin | grep -v -- '-merged')"
            merged="$(cd out && ls espkvm-*-"${board}"-merged.bin)"

            mkdir -p "site/firmware/${board}"
            cp "out/${bin}" "site/firmware/${board}/"
            cat > "site/firmware/${board}/manifest.json" <<EOF
          {
            "version": "${version}",
            "board": "${board}",
            "file": "${bin}",
            "size": $(stat -c%s "out/${bin}"),
            "sha256": "$(sha256sum "out/${bin}" | cut -d' ' -f1)",
            "released": "${released}",
            "notes": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${version}"
          }
          EOF

            mkdir -p "site/flash/${board}"
            cp "out/${merged}" "site/flash/${board}/"
            cat > "site/flash/${board}/manifest.json" <<EOF
          {
            "name": "ESP-KVM (${board})",
            "version": "${version}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-P4",
                "parts": [{ "path": "${merged}", "offset": 0 }]
              }
            ]
          }
          EOF
          done

          # Back-compat: devices and flasher pages that predate the per-board
          # layout fetch firmware/manifest.json and flash/manifest.json at the
          # root (this is also what every P4-ETH device polls by default). Mirror
          # the P4-ETH board there (its .bin filename inside the manifest is
          # relative, so the copied bin resolves alongside it).
          cp site/firmware/p4-eth/. site/firmware/ -r
          cp site/flash/p4-eth/. site/flash/ -r

          # fw.espkvm.io itself is only a file host; a person who opens it is
          # sent to the flasher. Pages cannot answer with a real redirect.
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://espkvm.io/flash/">
          <link rel="canonical" href="https://espkvm.io/flash/">
          <title>ESP-KVM firmware</title>
          <script>location.replace("https://espkvm.io/flash/")</script>
          <p><a href="https://espkvm.io/flash/">Install ESP-KVM from the browser</a></p>
          EOF
          # The board list the site's flasher reads, so adding a board here is
          # the whole job - the site needs no change. A -rev3 image is not a
          # board of its own but the twin of the one it is named after.
          # Board photos travel with the list, so a board the site has never
          # heard of still gets a picture. The site prefers its own copy where
          # it has one - same file, served from its own origin.
          mkdir -p site/flash/img
          for img in $(jq -r '.[].image // empty' boards/boards.json); do
            cp "$img" site/flash/img/
          done
          jq -n --arg ids "${boards}" --slurpfile known boards/boards.json '
              ($ids | split("\n") | map(select(length > 0))) as $all
              # boards.json order, not alphabetical: the first card is the one the
              # flasher selects, and that should be the board most people have.
              | (($known[0] | map(.id)) + ($all - ($known[0] | map(.id))))
              | map(select(. as $id | $all | index($id)))
              | map(select((endswith("-rev3") or endswith("-rev1")) | not))
              | map(. as $id
                    | ($known[0][] | select(.id == $id)) // { id: $id, label: $id }
                    | . + { manifest: ($id + "/manifest.json") }
                    | if .image then . + { image: ("img/" + (.image | split("/") | last)) } else . end
                    | if ($all | index($id + "-rev3"))
                      then . + { manifestRev3: ($id + "-rev3/manifest.json") }
                      # A board whose plain image is the rev 3.x one names its
                      # pre-3.0 twin -rev1 instead.
                      elif ($all | index($id + "-rev1"))
                      then . + { manifest: ($id + "-rev1/manifest.json"),
                                 manifestRev3: ($id + "/manifest.json") }
                      else . end)
            ' > site/flash/boards.json
          cat site/flash/boards.json

          find site -name manifest.json -print -exec cat {} \;

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

      # fw.espkvm.io is served by its own repository, espkvm/fw, so that this
      # repository's Pages stays at espkvm.github.io/espkvm with no redirect:
      # devices on 0.56.x and older read their manifests there and follow no
      # redirect. One commit, force-pushed, so old images do not pile up in
      # its history. FW_DEPLOY_KEY is a deploy key with write access there.
      - name: Publish to fw.espkvm.io (espkvm/fw)
        env:
          FW_DEPLOY_KEY: ${{ secrets.FW_DEPLOY_KEY }}
        run: |
          [ -n "${FW_DEPLOY_KEY}" ] || { echo "FW_DEPLOY_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${FW_DEPLOY_KEY}" > ~/.ssh/fw_key
          chmod 600 ~/.ssh/fw_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cp -r site fw
          echo fw.espkvm.io > fw/CNAME
          touch fw/.nojekyll
          printf '%s\n' "# fw.espkvm.io" "" \
            "Firmware images and update manifests for ESP-KVM, served at https://fw.espkvm.io/." \
            "Do not edit by hand: the release workflow in espkvm/espkvm replaces this" \
            "repository's content on every release." > fw/README.md
          cd fw
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${GITHUB_REF_NAME}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/fw_key -o IdentitiesOnly=yes" \
            git push -f git@github.com:espkvm/fw.git main
