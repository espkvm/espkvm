dependencies:
  espressif/mdns:
    version: "~1.12.0" # 1.15.0 fails to build here (-Werror=stringop-truncation)
  # WiFi via an onboard ESP32-C6 (esp-hosted slave over SDIO). Pulled in ONLY when
  # CONFIG_KVM_WIFI is set (the funcev board overlay), so the Waveshare build - which
  # has no C6 - never fetches or links these. See espkvm-wifi-plan / boards/README.
  espressif/esp_wifi_remote:
    version: "~1.6.5"
    rules:
      - if: "$CONFIG{KVM_WIFI} == True"
  espressif/esp_hosted:
    # 3.1.0 drops reads from older co-processor firmware (a C6 that reports
    # 0.0.0): "SDIO RX read exceeds staging target", then Wi-Fi goes quiet.
    version: "~3.0.10"
    rules:
      - if: "$CONFIG{KVM_WIFI} == True"
